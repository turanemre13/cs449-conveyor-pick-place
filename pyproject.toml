[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cs449-conveyor-pick-place"
version = "0.1.0"
description = "Dynamic robotic pick-and-place of moving conveyor objects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
perception = ["numpy>=1.24", "opencv-python>=4.8"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
